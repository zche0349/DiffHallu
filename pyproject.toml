[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffhallu"
version = "0.1.0"
description = "Model-agnostic implementation of DiffHallu for long-form hallucination detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Zi-Han Chen" },
  { name = "Rui-Lin Xie" },
  { name = "Lu-Lu Wang" },
  { name = "Li Liao" },
  { name = "Ying Zhou" },
]
keywords = ["hallucination detection", "large language models", "differential testing", "semantic entropy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pysbd>=0.3.4,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
